# ONURB-SYS // atualiza a cobrinha e os painéis de status do perfil
#
# Um único workflow gera TUDO e publica de uma vez na branch `output`.
# (Antes eram dois workflows publicando na mesma branch: o segundo apagava o .gif
#  da cobrinha que o primeiro tinha gerado — por isso só funcionava após "re-run".)

name: ONURB-SYS sync

on:
  schedule:
    - cron: "17 */12 * * *" # 2x por dia (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Começa a partir do que já está publicado: se algum passo falhar,
      # o arquivo antigo continua lá e a imagem não quebra no README.
      - name: Recuperar arquivos publicados
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: output
          path: dist
      - run: rm -rf dist/.git && mkdir -p dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar fontes
        run: npm i --no-save --no-package-lock --prefix scripts @fontsource/rajdhani@5 @fontsource/share-tech-mono@5

      - name: Gerar status / linguagens / atividade
        continue-on-error: true
        run: node scripts/generate.mjs dynamic dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff1f3d&color_dots=#160709,#4d0812,#80101f,#bf1630,#ff1f3d

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "ONURB-SYS // sync"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
